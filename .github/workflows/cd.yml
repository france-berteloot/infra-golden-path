name: CD

# Called from CI after quality succeeds — appears as a PR check (unlike workflow_run).
on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  TOOLING_VERSION: "1.0.0"
  TOOLING_UID: "1000"
  TOOLING_GID: "1000"
  CLUSTER_NAME: golden-path
  NAMESPACE: demo-app-staging
  KUBECONFIG_CONTEXT: kind-golden-path

jobs:
  deploy-staging:
    name: Deploy to kind (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set tooling image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOLING_IMAGE=${REGISTRY}/${owner}/docker-tooling:${TOOLING_VERSION}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull tooling image
        run: |
          docker pull "${{ env.TOOLING_IMAGE }}"
          docker tag "${{ env.TOOLING_IMAGE }}" tooling:ci

      - uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: scripts/kind-config.yaml

      # Non-root tooling user (UID 1000) needs write for terraform init and read for kubeconfig.
      - name: Align workspace ownership with tooling user
        run: sudo chown -R "${TOOLING_UID}:${TOOLING_GID}" "${{ github.workspace }}"

      - name: Prepare kubeconfig for non-root tooling
        run: |
          mkdir -p /tmp/kube-ci
          cp "${HOME}/.kube/config" /tmp/kube-ci/config
          chmod 644 /tmp/kube-ci/config

      - name: Terraform apply
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" \
            -v /tmp/kube-ci:/tmp/kube:ro \
            -w /work \
            -e KUBECONFIG=/tmp/kube/config \
            -e TF_VAR_kubeconfig_path=/tmp/kube/config \
            -e TF_VAR_kubeconfig_context="${{ env.KUBECONFIG_CONTEXT }}" \
            -e TF_VAR_namespace="${{ env.NAMESPACE }}" \
            -e TF_VAR_environment=staging \
            tooling:ci \
            bash -lc 'cd terraform/environments/local \
              && terraform init -backend=false \
              && terraform apply -auto-approve -input=false'

      - name: Helm deploy
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" \
            -v /tmp/kube-ci:/tmp/kube:ro \
            -w /work \
            -e KUBECONFIG=/tmp/kube/config \
            tooling:ci \
            helm upgrade --install demo-app helm/charts/demo-app \
              -f helm/charts/demo-app/values-staging.yaml \
              -n "${{ env.NAMESPACE }}"

      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=demo-app \
            -n "${{ env.NAMESPACE }}" \
            --timeout=120s

      - name: Smoke test
        run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://demo-app/

      - name: Verify platform labels
        run: |
          kubectl get namespace "${{ env.NAMESPACE }}" \
            -o jsonpath='{.metadata.labels.environment}{"\n"}' | grep -qx staging
          kubectl get sa demo-app -n "${{ env.NAMESPACE }}" \
            -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}{"\n"}' | grep -qx terraform
