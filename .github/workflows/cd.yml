name: CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: golden-path
  NAMESPACE: demo-app-staging
  KUBECONFIG_CONTEXT: kind-golden-path

jobs:
  deploy-staging:
    name: Deploy to kind (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Set tooling image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOLING_IMAGE=${REGISTRY}/${owner}/infra-golden-path-tooling" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull tooling image from GHCR
        id: pull
        continue-on-error: true
        run: docker pull "${{ env.TOOLING_IMAGE }}:latest"

      - name: Build tooling image (fallback)
        if: steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/tooling/Dockerfile
          push: false
          load: true
          tags: ${{ env.TOOLING_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare local tooling tag
        run: docker tag "${{ env.TOOLING_IMAGE }}:latest" tooling:ci

      - uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: scripts/kind-config.yaml

      - name: Terraform apply
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -v "${HOME}/.kube:/root/.kube:ro" \
            -w /work \
            -e TF_VAR_kubeconfig_context="${{ env.KUBECONFIG_CONTEXT }}" \
            -e TF_VAR_namespace="${{ env.NAMESPACE }}" \
            -e TF_VAR_environment=staging \
            tooling:ci \
            bash -lc 'cd terraform/environments/local \
              && terraform init -backend=false \
              && terraform apply -auto-approve -input=false'

      - name: Helm deploy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -v "${HOME}/.kube:/root/.kube:ro" \
            -w /work \
            -e KUBECONFIG=/root/.kube/config \
            tooling:ci \
            helm upgrade --install demo-app helm/charts/demo-app \
              -f helm/charts/demo-app/values-staging.yaml \
              -n "${{ env.NAMESPACE }}"

      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=demo-app \
            -n "${{ env.NAMESPACE }}" \
            --timeout=120s

      - name: Smoke test
        run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://demo-app/

      - name: Verify platform labels
        run: |
          kubectl get namespace "${{ env.NAMESPACE }}" \
            -o jsonpath='{.metadata.labels.environment}{"\n"}' | grep -qx staging
          kubectl get sa demo-app -n "${{ env.NAMESPACE }}" \
            -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}{"\n"}' | grep -qx terraform
