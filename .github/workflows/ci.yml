name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Set tooling image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOLING_IMAGE=${REGISTRY}/${owner}/infra-golden-path-tooling" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect tooling changes (PR)
        if: github.event_name == 'pull_request'
        id: tooling_changes
        run: |
          changed=false
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD \
            | grep -qE '^docker/tooling/|^\.pre-commit-config\.yaml|^\.dockerignore'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Pull tooling image from GHCR
        id: pull
        if: github.event_name == 'pull_request' && steps.tooling_changes.outputs.changed != 'true'
        continue-on-error: true
        run: docker pull "${{ env.TOOLING_IMAGE }}:latest"

      - name: Build and push tooling image (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tooling/Dockerfile
          push: true
          tags: |
            ${{ env.TOOLING_IMAGE }}:latest
            ${{ env.TOOLING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build tooling image (PR fallback or tooling changed)
        if: >-
          github.event_name == 'pull_request' &&
          (steps.pull.outcome == 'failure' || steps.tooling_changes.outputs.changed == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tooling/Dockerfile
          push: false
          load: true
          tags: ${{ env.TOOLING_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare local tooling tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            docker pull "${{ env.TOOLING_IMAGE }}:latest"
          fi
          docker tag "${{ env.TOOLING_IMAGE }}:latest" tooling:ci

      - name: Pre-commit
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            pre-commit run --all-files --show-diff-on-failure

      - name: Kubeconform
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'helm template demo-app helm/charts/demo-app \
              -f helm/charts/demo-app/values-staging.yaml \
              --namespace demo-app-staging \
              | kubeconform -summary -ignore-missing-schemas'

      - name: Package Helm chart
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'mkdir -p dist && helm package helm/charts/demo-app -d dist && ls -la dist/'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 7
