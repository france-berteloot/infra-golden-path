name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  TOOLING_VERSION: "1.0.0"

jobs:
  quality:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set tooling image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOLING_IMAGE=${REGISTRY}/${owner}/docker-tooling:${TOOLING_VERSION}" >> "$GITHUB_ENV"
          # Override image USER (1000): same UID as the runner so bind mounts work without chown.
          echo "DOCKER_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull tooling image
        run: |
          docker pull "${{ env.TOOLING_IMAGE }}"
          docker tag "${{ env.TOOLING_IMAGE }}" tooling:ci

      - name: Pre-commit
        run: |
          docker run --rm \
            --user "${DOCKER_USER}" \
            -e HOME=/tmp \
            -e PRE_COMMIT_HOME=/tmp/pre-commit \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            pre-commit run --all-files --show-diff-on-failure

      - name: Kubeconform
        run: |
          docker run --rm \
            --user "${DOCKER_USER}" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'helm template demo-app helm/charts/demo-app \
              -f helm/charts/demo-app/values-staging.yaml \
              --namespace demo-app-staging \
              | kubeconform -summary -ignore-missing-schemas'

      - name: Package Helm chart
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            --user "${DOCKER_USER}" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'mkdir -p dist && helm package helm/charts/demo-app -d dist && ls -la dist/'

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 7

  # Same workflow run → CD shows as a PR check; only starts after quality succeeds.
  deploy:
    name: CD
    needs: quality
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
