name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  TOOLING_VERSION: "1.0.0"
  # Non-root user in docker-tooling (UID/GID 1000)
  TOOLING_UID: "1000"
  TOOLING_GID: "1000"

jobs:
  quality:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set tooling image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOLING_IMAGE=${REGISTRY}/${owner}/docker-tooling:${TOOLING_VERSION}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull tooling image
        run: |
          docker pull "${{ env.TOOLING_IMAGE }}"
          docker tag "${{ env.TOOLING_IMAGE }}" tooling:ci

      # Workspace is owned by the runner user; the image runs as UID 1000 and needs write
      # access for pre-commit fixers and terraform init (.terraform/).
      - name: Align workspace ownership with tooling user
        run: sudo chown -R "${TOOLING_UID}:${TOOLING_GID}" "${{ github.workspace }}"

      - name: Pre-commit
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            pre-commit run --all-files --show-diff-on-failure

      - name: Kubeconform
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'helm template demo-app helm/charts/demo-app \
              -f helm/charts/demo-app/values-staging.yaml \
              --namespace demo-app-staging \
              | kubeconform -summary -ignore-missing-schemas'

      - name: Package Helm chart
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            tooling:ci \
            bash -lc 'mkdir -p dist && helm package helm/charts/demo-app -d dist && ls -la dist/'

      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 7
